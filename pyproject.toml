[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tlumi"
version = "0.1.0"
description = "Terraform-like workflow for Python infrastructure-as-code, powered by Pulumi"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Jay W", email = "git.jaydoubleu@gmail.com" },
]
keywords = ["infrastructure", "iac", "pulumi", "terraform", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    # typer < 0.16 produces a non-functional CLI: 0.12.x cannot parse the PEP 604
    # "str | None" option annotations, and 0.13-0.15.3 break against click >= 8.2
    # (make_metavar signature change). The floor is pinned to 0.26.8, the tested
    # and locked release; typer >= 0.26 also vendors click's command resolution,
    # which cli.py feature-detects for unknown-command suggestions.
    "typer>=0.26.8",
    # cli.py imports click directly (feature detection for suggestion handling);
    # 8.0 is typer's own click minimum.
    "click>=8.0",
    # rich 13.8.0 is the first release where Console.on_broken_pipe exists and
    # Console._check_buffer intercepts BrokenPipeError; _TlumiConsole's EPIPE
    # handling (display.py) overrides that hook, so earlier rich breaks the
    # exit-code guarantee and fails the broken-pipe tests.
    "rich>=13.8.0",
    "pulumi>=3.249.0",
    # pyyaml 6.0/6.0.0 fail to build from source on Python 3.12+ (Cython 3
    # incompatibility); 6.0.1 is the first floor installable everywhere we
    # claim support.
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
    "packaging>=21.0",
]

[project.scripts]
tlumi = "tlumi.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.14",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
    "ruff>=0.15.20",
    "bandit>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/jaydoubleu/tlumi"
Repository = "https://github.com/jaydoubleu/tlumi"
Issues = "https://github.com/jaydoubleu/tlumi/issues"
Changelog = "https://github.com/jaydoubleu/tlumi/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tlumi"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    "docs",
    ".scenarios",
    "todo_continue",
]
# File patterns are anchored with a leading slash: hatchling patterns are
# gitignore-style, so a bare "README.md" would also match README.md files in
# ANY subdirectory (this once pulled an internal todo_continue/README.md into
# the published sdist). Keep new entries anchored.
include = [
    "/src/tlumi",
    "/tests",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/DESIGN.md",
]

[tool.mypy]
python_version = "3.10"
files = ["src/tlumi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
