name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the trailing comment is
# the tag the SHA was resolved from); see ci.yml for rationale. The release
# path deliberately avoids the shared Actions cache: artifacts published to
# PyPI must be built from pristine sources, not from cache entries that any
# PR workflow could have populated.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Verify release tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match pyproject version '$VERSION'." >&2
            echo "Fix the tag or bump [project].version before publishing." >&2
            exit 1
          fi
      - name: Sync dev dependencies
        run: uv sync --locked --dev
      # Never publish artifacts from a commit that was not fully tested: the
      # release event fires on any published GitHub release, with no guarantee
      # the tagged commit passed CI.
      - name: Lint
        run: |
          uv run ruff check src/ tests/ examples/
          uv run ruff format --check src/ tests/
          uv run mypy
          uv run bandit -r src/ -q
      - name: Run tests
        run: uv run python -m pytest tests/ -q
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Verify sdist contains no internal files
        run: |
          LEAKS=$(tar -tzf dist/*.tar.gz | grep -E 'todo_continue|\.claude|docs/internal|\.scenarios' || true)
          if [ -n "$LEAKS" ]; then
            echo "Internal files leaked into the sdist:" >&2
            echo "$LEAKS" >&2
            exit 1
          fi
      - name: Smoke-test wheel install
        run: |
          uv venv /tmp/smoke-venv
          VIRTUAL_ENV=/tmp/smoke-venv uv pip install dist/*.whl
          /tmp/smoke-venv/bin/tlumi version
          /tmp/smoke-venv/bin/tlumi --help > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC); no API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
