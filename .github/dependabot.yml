version: 2
updates:
  # Keep pinned action SHAs current (ci.yml / release.yml pin by commit).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # 'uv' (not 'pip') is the ecosystem that manages uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
